name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: api_testing
          POSTGRES_USER: api
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api -d api_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pcntl
          coverage: none
      - uses: actions/cache@v5
        with:
          path: api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Run unit tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: api_testing
          DB_USERNAME: api
          DB_PASSWORD: ci_password
        run: php artisan test --testsuite=Unit
      - name: Run deploy-gating feature tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: api_testing
          DB_USERNAME: api
          DB_PASSWORD: ci_password
        run: >-
          php artisan test
          tests/Feature/ExampleTest.php
          tests/Feature/Api/V1/DeviceAuthControllerTest.php
          tests/Feature/Api/V1/ShiftExceptionControllerTest.php
          tests/Feature/Api/V1/ShiftTemplateControllerTest.php

  panel-checks:
    name: Panel checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run postinstall
      - run: npm run typecheck
      - run: npm run build

  production-config:
    name: Production configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: validation-only
          APP_KEY: base64:dmFsaWRhdGlvbi1vbmx5LXZhbGlkYXRpb24tb25seQ==
          SERVER_HOST: 164.90.220.150
          SERVER_SCHEME: http
          REVERB_APP_ID: validation
          REVERB_APP_KEY: validation
          REVERB_APP_SECRET: validation
          SEED_ADMIN_EMAIL: admin@inspection.local
          SEED_ADMIN_PASSWORD: validation-only
          SESSION_SECURE_COOKIE: 'false'
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api-tests, panel-checks, production-config]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_READ_TOKEN: ${{ github.token }}
        with:
          host: 164.90.220.150
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:jH+w18Bqvj87eFpWmqD62JvVE+9v8JldItH08cjyge8
          port: 22
          command_timeout: 30m
          envs: DEPLOY_SHA,REPOSITORY,GH_READ_TOKEN
          script: |
            set -euo pipefail
            APP_DIR=/opt/inspection
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                sudo "$@"
              fi
            }

            if ! command -v git >/dev/null 2>&1; then
              run_root apt-get update
              run_root apt-get install -y git
            fi

            run_root install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" "$APP_DIR"
            AUTH_HEADER="Basic $(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 | tr -d '\n')"
            REPOSITORY_URL="https://github.com/${REPOSITORY}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git -c http.extraHeader="Authorization: $AUTH_HEADER" clone --branch main --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git remote set-url origin "$REPOSITORY_URL"
            git checkout main
            for env_file in .env api/.env panel/.env; do
              if [ -f "$env_file" ] && ! git ls-files --error-unmatch "$env_file" >/dev/null 2>&1; then
                mv "$env_file" "${env_file}.pre-repository"
              fi
            done
            git -c http.extraHeader="Authorization: $AUTH_HEADER" pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            run_root bash scripts/bootstrap-vps.sh "$(id -un)"
            bash scripts/deploy.sh
