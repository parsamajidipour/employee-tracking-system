name: app
description: "Smart Inspection field tracking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  uuid: ^4.6.0
  permission_handler: ^13.0.0
  flutter_foreground_task: ^9.2.2
  workmanager: 0.7.0
  geolocator: ^14.0.2
  sqflite: ^2.4.1
  path: ^1.9.0
  battery_plus: ^7.1.1
  package_info_plus: ^9.0.1
  open_filex: ^4.7.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  permission_handler_android: 13.0.1
  geolocator_android: 4.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
