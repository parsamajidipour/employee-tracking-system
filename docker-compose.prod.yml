services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command: [postgres, -c, shared_buffers=256MB, -c, effective_cache_size=768MB, -c, work_mem=8MB, -c, max_connections=80]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api}
      POSTGRES_USER: ${POSTGRES_USER:-api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-api} -d ${POSTGRES_DB:-api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    volumes:
      - ./api/storage/app/basemap:/var/www/html/storage/app/basemap:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &api-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: "${SERVER_SCHEME:-https}://${SERVER_HOST:?SERVER_HOST is required}:${API_PORT:-8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-api}
      DB_USERNAME: ${POSTGRES_USER:-api}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: "null"
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
      REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
      SANCTUM_STATEFUL_DOMAINS: "${SERVER_HOST}:${PANEL_PORT:-3000}"
      CORS_ALLOWED_ORIGINS: "${SERVER_SCHEME:-https}://${SERVER_HOST}:${PANEL_PORT:-3000}"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      TRACKING_RETENTION_DAYS: ${TRACKING_RETENTION_DAYS:-7}
      SEED_FAKE_DATA: "false"
      RUN_STARTUP_TESTS: "false"
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
    volumes:
      - api_storage:/var/www/html/storage/app/private
    ports:
      - "${API_PORT:-8000}:8000"
      - "${REVERB_PORT:-8080}:8080"
    security_opt: [no-new-privileges:true]

  panel:
    build:
      context: ./panel
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: "${SERVER_SCHEME:-https}://${SERVER_HOST}:${API_PORT:-8000}"
      NUXT_PUBLIC_API_PORT: ${API_PORT:-8000}
      NUXT_PUBLIC_REVERB_HOST: ${SERVER_HOST}
      NUXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-8080}
      NUXT_PUBLIC_REVERB_SCHEME: ${SERVER_SCHEME:-https}
      NUXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
      NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${PANEL_PORT:-3000}:3000"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  api_storage:
