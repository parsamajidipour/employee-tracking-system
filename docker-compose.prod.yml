# Not for dev. In dev, the Nuxt panel runs on the host via `npm run dev` —
# see README.md. This file adds the panel as a containerized service on top
# of the base stack, for deploying alongside api/. See DECISIONS.md for why
# the two are split. Note: panel/Dockerfile still runs the Nuxt dev server
# (npm run dev), not a production build — that's a follow-up, not done here.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  panel:
    build:
      context: ./panel
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # The api/ origin as seen by the browser, not the in-network service
      # name — the login flow runs in the browser, not server-to-server.
      NUXT_PUBLIC_API_BASE: "http://localhost:${API_PORT:-8000}"
    env_file:
      - ./panel/.env
    ports:
      - "${PANEL_PORT:-3000}:3000"
