services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api}
      POSTGRES_USER: ${POSTGRES_USER:-api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api} -d ${POSTGRES_DB:-api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  api:
    build:
      context: ./api
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-api}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: "null"
      SEED_FAKE_DATA: "true"
      RUN_STARTUP_TESTS: "false"
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      SANCTUM_STATEFUL_DOMAINS: "localhost:${PANEL_PORT:-3000},127.0.0.1:${PANEL_PORT:-3000},${LAN_HOST:-localhost}:${PANEL_PORT:-3000}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${PANEL_PORT:-3000},http://127.0.0.1:${PANEL_PORT:-3000},http://${LAN_HOST:-localhost}:${PANEL_PORT:-3000}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-}"
    ports:
      - "${API_PORT:-8000}:8000"
      - "${REVERB_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          memory: 128M

  panel:
    build:
      context: ./panel
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_PORT: "${API_PORT:-8000}"
      NUXT_PUBLIC_REVERB_PORT: "${REVERB_PORT:-8080}"
      NUXT_PUBLIC_REVERB_SCHEME: http
      NUXT_PUBLIC_REVERB_APP_KEY: "${REVERB_APP_KEY:-}"
    ports:
      - "${PANEL_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
