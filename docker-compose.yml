services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api}
      POSTGRES_USER: ${POSTGRES_USER:-api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-api} -d ${POSTGRES_DB:-api}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-api}
      DB_USERNAME: ${POSTGRES_USER:-api}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # The Nuxt panel runs on the host (npm run dev), not in this stack —
      # this is the port it listens on there.
      SANCTUM_STATEFUL_DOMAINS: "localhost:${PANEL_PORT:-3000},127.0.0.1:${PANEL_PORT:-3000}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${PANEL_PORT:-3000}"
    env_file:
      - ./api/.env
    ports:
      - "${API_PORT:-8000}:8000"
      - "${REVERB_PORT:-8080}:8080"
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

volumes:
  postgres_data:
  redis_data:
